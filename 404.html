<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
  // Esta página se sirve para CUALQUIER ruta que no existe (incluso /a/b/c): sin esto sus estilos, ícono y botones
  // se pedían relativos a esa ruta y fallaban. En github.io/CUPO/ la raíz es /CUPO/; en el dominio propio es /.
  (function () {
    var root = /^\/CUPO\//i.test(location.pathname) ? "/CUPO/" : "/";
    document.write('<base href="' + root + '">');
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUPO — Página no encontrada</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>
<nav class="navbar">
  <a href="index.html" class="logo"><img class="logo-img" src="assets/logo.png" alt="CUPO" width="104" height="32"></a>
</nav>

<main id="main" tabindex="-1" style="max-width:480px;margin:120px auto;text-align:center;padding:0 20px">
  <div style="font-size:72px;font-weight:800;color:var(--indigo);line-height:1">404</div>
  <h1 style="margin:16px 0 8px;font-size:24px">Este cupo ya no está disponible</h1>
  <p class="sub" style="margin-bottom:28px">La página que buscas no existe o se movió de lugar.</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <a href="cliente.html" class="btn btn-primary">Ver cupos disponibles</a>
    <a href="index.html" class="btn btn-outline">Ir al inicio</a>
    <a href="negocios.html" class="btn btn-outline">Para negocios</a>
  </div>
</main>

<script>
  // Con <base href="/"> el href="#main" apuntaría a la portada: el enlace enfoca el contenido sin navegar.
  document.querySelector(".skip-link").addEventListener("click", function (e) {
    e.preventDefault();
    document.getElementById("main").focus();
  });
</script>
</body>
</html>
