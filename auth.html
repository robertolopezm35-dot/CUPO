<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUPO — Entrar</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo"><span class="logo-badge">C</span> CUPO</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="role-toggle">
      <button type="button" id="roleClienteBtn" class="active">Cliente</button>
      <button type="button" id="roleNegocioBtn">Negocio</button>
    </div>

    <h1 id="authTitle">Crear cuenta</h1>
    <p class="sub" id="authSub">Encuentra citas de último momento cerca de ti.</p>

    <div class="error-msg" id="errorMsg"></div>

    <!-- REGISTER: CLIENTE -->
    <form class="form-panel" id="registerClienteForm" data-role="cliente" data-mode="register">
      <div class="field-row">
        <div class="field">
          <label>Nombre</label>
          <input type="text" name="firstName" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label>Apellido</label>
          <input type="text" name="lastName" autocomplete="family-name" required>
        </div>
      </div>
      <div class="field">
        <label>Correo</label>
        <input type="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label>Teléfono</label>
        <div class="phone-row">
          <select name="countryIso" id="countryCodeSelect"></select>
          <input type="tel" name="phone" inputmode="numeric" maxlength="10" pattern="\d{10}" placeholder="10 dígitos" autocomplete="tel-national" required>
        </div>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" autocomplete="new-password" required minlength="4">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Crear cuenta de cliente</button>
    </form>

    <!-- REGISTER: NEGOCIO -->
    <form class="form-panel" id="registerNegocioForm" data-role="negocio" data-mode="register">
      <div class="field">
        <label>Nombre del negocio</label>
        <input type="text" name="name" autocomplete="organization" required>
      </div>
      <div class="field">
        <label>Categoría</label>
        <select name="category" id="registerCategorySelect" required></select>
      </div>
      <div class="field">
        <label>Dirección</label>
        <input type="text" name="address" autocomplete="street-address" required>
      </div>
      <div class="field">
        <label>Correo</label>
        <input type="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" autocomplete="new-password" required minlength="4">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Registrar mi negocio</button>
    </form>

    <!-- LOGIN: CLIENTE -->
    <form class="form-panel" id="loginClienteForm" data-role="cliente" data-mode="login">
      <div class="field">
        <label>Correo</label>
        <input type="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      <button type="button" class="btn-link-forgot" data-forgot>¿Olvidaste tu contraseña?</button>
    </form>

    <!-- LOGIN: NEGOCIO -->
    <form class="form-panel" id="loginNegocioForm" data-role="negocio" data-mode="login">
      <div class="field">
        <label>Correo</label>
        <input type="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      <button type="button" class="btn-link-forgot" data-forgot>¿Olvidaste tu contraseña?</button>
    </form>

    <!-- RECUPERAR CONTRASEÑA -->
    <form class="form-panel" id="forgotPasswordForm">
      <div class="field">
        <label>Correo</label>
        <input type="email" name="email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Enviar link</button>
      <button type="button" class="btn-link-forgot" id="backToLoginBtn">← Regresar a iniciar sesión</button>
    </form>

    <div class="mode-toggle">
      <span id="modeToggleText">¿Ya tienes cuenta?</span>
      <button type="button" id="modeToggleBtn">Inicia sesión</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/store.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-store.js"></script>
<script src="js/data-adapter.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
