<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUPO — Nueva contraseña</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo"><span class="logo-badge">C</span> CUPO</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Nueva contraseña</h1>
    <p class="sub" id="pageSub">Elige una contraseña nueva para tu cuenta.</p>

    <div class="error-msg" id="errorMsg"></div>

    <form class="form-panel active" id="resetPasswordForm">
      <div class="field">
        <label>Nueva contraseña</label>
        <input type="password" name="password" autocomplete="new-password" required minlength="4">
      </div>
      <div class="field">
        <label>Confirmar contraseña</label>
        <input type="password" name="password2" autocomplete="new-password" required minlength="4">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Guardar contraseña</button>
    </form>

    <div id="invalidLinkPanel" hidden>
      <a href="auth.html?mode=login" class="btn btn-outline btn-block">Volver a iniciar sesión</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/store.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-store.js"></script>
<script src="js/data-adapter.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
