<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUPO — Nueva contraseña</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>
<nav class="navbar">
  <a href="index.html" class="logo"><span class="logo-badge">C</span> CUPO</a>
</nav>

<main class="auth-wrap" id="main" tabindex="-1">
  <div class="auth-card">
    <h1>Nueva contraseña</h1>
    <p class="sub" id="pageSub">Elige una contraseña nueva para tu cuenta.</p>

    <div class="error-msg" id="errorMsg"></div>

    <form class="form-panel active" id="resetPasswordForm">
      <div class="field">
        <label>Nueva contraseña</label>
        <input type="password" name="password" autocomplete="new-password" required minlength="6">
      </div>
      <div class="field">
        <label>Confirmar contraseña</label>
        <input type="password" name="password2" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Guardar contraseña</button>
    </form>

    <div id="invalidLinkPanel" hidden>
      <a href="auth.html?mode=login" class="btn btn-outline btn-block">Volver a iniciar sesión</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
<script src="js/schedule.js"></script>
<script src="js/validate.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-store.js"></script>
<script src="js/data-adapter.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
